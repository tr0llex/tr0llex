name: CI

# Репозиторий профиля — только два README. Гейтить здесь нечего, кроме двух
# вещей, которые ломаются молча: упоминания ИИ в коммитах и битые ссылки.
# Профиль — первое, что видит человек на странице, и мёртвая ссылка в нём
# дороже, чем в любом коде.

on:
  pull_request:
  push:
    branches-ignore: [main]

# Минимальные права для GITHUB_TOKEN: CI только читает код. Без этого блока
# действуют настройки репозитория, и любой шаг (включая сторонние actions)
# получает тот токен, который там выставлен.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в опубликованную историю, и убирать его пришлось переписыванием. Локальный
  # хук (.githooks/commit-msg) ловит это раньше, но он включается вручную и в
  # клоне отсутствует — здесь страховка.
  commits:
    name: Коммиты без упоминаний ИИ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="origin/main..HEAD"
          fi
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  # Только относительные ссылки и картинки. Внешние домены не проверяем
  # намеренно: чужой сайт, лежащий пять минут, не повод красить свой профиль.
  links:
    name: Ссылки внутри репозитория
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Проверить, что все относительные ссылки существуют
        run: |
          fail=0
          for f in README.md README.ru.md; do
            grep -oE '\]\(([^)]+)\)|src="([^"]+)"' "$f" \
              | sed -E 's/^\]\(//; s/\)$//; s/^src="//; s/"$//' \
              | grep -vE '^(https?:|mailto:|#)' \
              | sed 's/#.*//' | grep -v '^$' | sort -u \
              | while read -r target; do
                  if [ ! -e "$target" ]; then
                    echo "::error file=$f::битая ссылка: $target"
                    exit 1
                  fi
                done || fail=1
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "все относительные ссылки на месте"
